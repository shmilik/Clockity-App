<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - Clockity (a nod to Unicity)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0800 0%, #3d1000 40%, #6b2000 100%);
            color: #f5e0d0;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(210, 100, 20, 0.35);
            border-radius: 16px;
            background: rgba(30, 10, 2, 0.92);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(180, 70, 0, 0.15);
        }

        .login-logo-wrap {
            text-align: center;
            padding: 2rem 1rem 0.5rem;
        }

        .login-logo-wrap img {
            width: 130px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(200, 80, 0, 0.5));
        }

        .login-tagline {
            text-align: center;
            font-size: 0.78rem;
            color: #c06030;
            letter-spacing: 0.04em;
            padding-bottom: 0.75rem;
        }

        .login-card .card-body {
            padding: 1.5rem 2rem 2rem;
        }

        .form-label {
            color: #e8c4a0;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .form-control {
            background: #1c0800;
            border-color: #6b2c00;
            color: #f5e0d0;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #1c0800;
            color: #f5e0d0;
            border-color: #e06010;
            box-shadow: 0 0 0 0.2rem rgba(220, 90, 10, 0.25);
        }

        .form-control::placeholder {
            color: #7a4020;
        }

        .btn-signin {
            background: linear-gradient(135deg, #cc4400 0%, #ff8c00 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.03em;
            border-radius: 8px;
            padding: 0.55rem;
            transition: opacity 0.2s;
        }

        .btn-signin:hover {
            opacity: 0.88;
            color: #fff;
        }

        .btn-outline-secondary {
            border-color: #6b2c00 !important;
            color: #c07040 !important;
            border-radius: 8px;
        }

        .btn-outline-secondary:hover {
            background: rgba(150, 60, 0, 0.2) !important;
            color: #ffaa60 !important;
        }

        .divider {
            border-color: rgba(180, 80, 0, 0.25);
            margin: 1.2rem 0;
        }

        .forgot-link {
            color: #e07030;
            font-size: 0.84rem;
        }

        .forgot-link:hover {
            color: #ffaa60;
        }

        .form-check-input:checked {
            background-color: #cc4400;
            border-color: #cc4400;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-logo-wrap">
            <img src="/static/images/clockity-logo.png" alt="Clockity Logo">
        </div>
        <div class="login-tagline">a nod to Unicity</div>

        <div class="card-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }} py-2" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">
                <div class="mb-3">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-control" name="email" placeholder="Enter your username or email" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="password" id="passwordInput" placeholder="Enter your password" required>
                        <button class="btn btn-outline-secondary" type="button"
                            onclick="var i=document.getElementById('passwordInput');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈';">👁</button>
                    </div>
                </div>
                <div class="mb-4 d-flex align-items-center">
                    <input class="form-check-input me-2" type="checkbox" name="remember_me" id="rememberMe" value="1">
                    <label class="form-check-label" for="rememberMe" style="cursor:pointer; color:#c07040; font-size:.88rem;">Remember Me</label>
                </div>
                <button class="btn btn-signin w-100" type="submit">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <a href="/forgot-password" class="forgot-link">Forgot your password?</a>
            </div>
            <hr class="divider">
            <div class="text-center">
                <a href="/verify-invite" class="btn btn-outline-secondary w-100" style="font-size:.9rem;">
                    New employee? Create Account →
                </a>
            </div>
        </div>
    </div>
</body>
</html>
