<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Invite Code - Clockity (a nod to Unicity)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0800 0%, #3d1000 40%, #6b2000 100%);
            color: #f5e0d0;
        }

        .invite-card {
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(210, 100, 20, 0.35);
            border-radius: 16px;
            background: rgba(30, 10, 2, 0.92);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(180, 70, 0, 0.15);
        }

        .login-logo-wrap {
            text-align: center;
            padding: 2rem 1rem 0.5rem;
        }

        .login-logo-wrap img {
            width: 130px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(200, 80, 0, 0.5));
        }

        .login-tagline {
            text-align: center;
            font-size: 0.78rem;
            color: #c06030;
            letter-spacing: 0.04em;
            padding-bottom: 0.75rem;
        }

        .invite-card .card-body {
            padding: 1.5rem 2rem 2rem;
        }

        .form-control {
            background: #1c0800;
            border-color: #6b2c00;
            color: #f5e0d0;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: .2em;
            font-family: monospace;
            font-size: 1.3rem;
            text-align: center;
        }

        .form-control:focus {
            background: #1c0800;
            color: #f5e0d0;
            border-color: #e06010;
            box-shadow: 0 0 0 0.2rem rgba(220, 90, 10, 0.25);
        }

        .form-control::placeholder {
            color: #7a4020;
            letter-spacing: .15em;
            opacity: 1;
            font-size: 1rem;
        }

        .btn-signin {
            background: linear-gradient(135deg, #cc4400 0%, #ff8c00 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.03em;
            border-radius: 8px;
            padding: 0.55rem;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-signin:hover {
            opacity: 0.88;
            color: #fff;
        }

        .divider {
            border-color: rgba(180, 80, 0, 0.25);
            margin: 1.2rem 0;
        }
    </style>
</head>
<body>
    <div class="card invite-card">
        <div class="login-logo-wrap">
            <img src="/static/images/clockity-logo.png" alt="Clockity Logo">
        </div>
        <div class="login-tagline">a nod to Unicity</div>

        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
            {% endif %}

            <p class="text-center mb-4" style="font-size:.875rem; color:#c07040;">
                Ask your admin, manager, or developer for a code.<br>
                Codes expire <strong style="color:#ff8c00;">5 minutes</strong> after being generated.
            </p>

            <form method="POST" action="/verify-invite" id="verifyForm">
                <div class="mb-4">
                    <input type="text" class="form-control py-3" name="invite_code" id="inviteCodeInput"
                           required autofocus maxlength="9" placeholder="XXXX-XXXX"
                           oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')">
                </div>
                <button class="btn btn-signin w-100 py-2" type="submit">
                    Verify Code →
                </button>
            </form>

            <hr class="divider">
            <div class="text-center">
                <a href="/login" style="color:#c07040; font-size:.85rem;">← Back to Sign In</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-fill code from URL ?code= param (used by "Copy Link" from the management panel)
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (code) {
                var input = document.getElementById('inviteCodeInput');
                if (input) {
                    input.value = code.toUpperCase().replace(/[^A-Z0-9-]/g, '');
                }
            }
        })();
    </script>
</body>
</html>
